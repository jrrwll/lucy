pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        mavenCentral()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }

    resolutionStrategy {
        eachPlugin {
            if (requested.id.namespace == 'org.dreamcat') {
                useModule("org.dreamcat:rita-boot-gradle-plugin:${requested.version}")
            }
        }
    }
}

rootProject.name = 'lucy'

include 'lucy-core'
include 'lucy-api'
include 'lucy-shorten'
include 'lucy-imgurl'
